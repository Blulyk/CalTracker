name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project CalTracker.xcodeproj \
            -scheme CalTracker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project CalTracker.xcodeproj \
            -scheme CalTracker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            test
