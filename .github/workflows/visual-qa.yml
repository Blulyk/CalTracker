name: Visual QA

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Select simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available
          SIM="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          preferred=("iPhone 17 Pro","iPhone 17","iPhone 16 Pro","iPhone 16")
          devices=[d for runtime in data.values() for d in runtime if d.get("isAvailable")]
          for name in preferred:
              match=next((d for d in devices if d["name"]==name),None)
              if match:
                  print(match["udid"])
                  break
          else:
              print(next(d["udid"] for d in devices if d["name"].startswith("iPhone")))
          ')"
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      - name: Build debug app
        run: |
          set -o pipefail
          xcodebuild \
            -project CalTracker.xcodeproj \
            -scheme CalTracker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath visual-build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture primary screens
        run: |
          set -euo pipefail
          APP="$(find visual-build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -type d | head -n 1)"
          mkdir -p screenshots

          simctl() {
            local limit="$1"
            shift
            python3 - "$limit" "$@" <<'PY'
          import subprocess, sys
          try:
              result = subprocess.run(
                  ["xcrun", "simctl", *sys.argv[2:]],
                  timeout=int(sys.argv[1])
              )
              raise SystemExit(result.returncode)
          except subprocess.TimeoutExpired:
              print("simctl timed out: " + " ".join(sys.argv[2:]), file=sys.stderr)
              raise SystemExit(124)
          PY
          }

          simctl 180 boot "$SIM"
          simctl 45 install "$SIM" "$APP"

          capture() {
            local tab="$1"
            local file="$2"
            local appearance="${3:--ui-dark}"
            simctl 45 terminate "$SIM" com.blulyk.CalTracker 2>/dev/null || true
            simctl 45 launch "$SIM" com.blulyk.CalTracker -ui-testing "$appearance" -ui-tab "$tab"
            sleep 3
            simctl 45 io "$SIM" screenshot "screenshots/$file"
          }

          capture today today.png
          capture recipes recipes.png
          capture history history.png
          capture profile profile.png
          simctl 45 terminate "$SIM" com.blulyk.CalTracker 2>/dev/null || true
          simctl 45 launch "$SIM" com.blulyk.CalTracker -ui-testing -ui-dark -ui-log
          sleep 3
          simctl 45 io "$SIM" screenshot screenshots/log.png
          simctl 45 terminate "$SIM" com.blulyk.CalTracker 2>/dev/null || true
          simctl 45 launch "$SIM" com.blulyk.CalTracker -ui-testing -ui-dark -ui-buffet
          sleep 3
          simctl 45 io "$SIM" screenshot screenshots/buffet.png
          capture today today-light.png -ui-light

      - uses: actions/upload-artifact@v6
        with:
          name: CalTracker-visual-qa
          path: screenshots/*.png
          if-no-files-found: error
